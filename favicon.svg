<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон с градиентом -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Декоративная рамка -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="url(#primary)" stroke-width="1" opacity="0.3"/>

  <!-- Центральная иконка - код/разработка -->
  <g transform="translate(16,16)">
    <!-- Монитор/экран -->
    <rect x="-8" y="-6" width="16" height="10" rx="2" fill="#2c3e50" stroke="url(#primary)" stroke-width="1"/>

    <!-- Экран монитора -->
    <rect x="-6" y="-4" width="12" height="6" rx="1" fill="#34495e"/>

    <!-- Код на экране -->
    <rect x="-5" y="-3" width="3" height="0.8" rx="0.2" fill="url(#accent)"/>
    <rect x="-5" y="-1.8" width="5" height="0.8" rx="0.2" fill="url(#primary)"/>
    <rect x="-5" y="-0.6" width="4" height="0.8" rx="0.2" fill="url(#accent)"/>
    <rect x="-5" y="0.6" width="6" height="0.8" rx="0.2" fill="url(#primary)"/>
    <rect x="-5" y="1.8" width="3.5" height="0.8" rx="0.2" fill="url(#accent)"/>

    <!-- Подставка монитора -->
    <rect x="-2" y="4" width="4" height="2" rx="1" fill="#2c3e50"/>
    <rect x="-3" y="6" width="6" height="1" rx="0.5" fill="#34495e"/>
  </g>

  <!-- Декоративные элементы -->
  <circle cx="8" cy="8" r="1.5" fill="url(#accent)" opacity="0.6" filter="url(#glow)"/>
  <circle cx="24" cy="8" r="1" fill="url(#primary)" opacity="0.4"/>
  <circle cx="8" cy="24" r="1" fill="url(#primary)" opacity="0.4"/>
  <circle cx="24" cy="24" r="1.5" fill="url(#accent)" opacity="0.6" filter="url(#glow)"/>

  <!-- Блестящие точки -->
  <circle cx="6" cy="6" r="0.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="6" r="0.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="6" cy="26" r="0.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="26" r="0.5" fill="#ffffff" opacity="0.8"/>
</svg>
